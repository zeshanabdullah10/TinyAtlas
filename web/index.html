<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 12 8l6 10 4-6 8 14z' fill='%23b89b6a'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #e9e2d0; font-family: system-ui, sans-serif; color: #2b2418; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 8px 12px; background: #fffaf0e6; border-radius: 8px; font-size: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 4px #0002; }
  #hud label { font-size: 12px; color: #6b5f48; cursor: pointer; }
  #hud button { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid #b8a67e; background: #fff; border-radius: 6px; cursor: pointer; }
  #panel { position: fixed; top: 12px; right: 12px; bottom: 34px; width: min(340px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .card { background: #fffaf0f2; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 6px #0003; pointer-events: auto; font-size: 13px; line-height: 1.45; }
  #story h2 { margin: 0 0 4px; font-size: 16px; }
  #story .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a7a55; }
  #story a, #log a { color: #7a4b2a; }
  #chat { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; max-height: 42vh; }
  #chat h3 { margin: 0 0 6px; font-size: 13px; }
  #log { overflow-y: auto; flex: 0 1 auto; min-height: 40px; max-height: 26vh; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .q { align-self: flex-end; background: #ead9b5; padding: 5px 9px; border-radius: 10px 10px 2px 10px; max-width: 90%; }
  .a { background: #fff; padding: 6px 9px; border-radius: 10px 10px 10px 2px; max-width: 95%; border: 1px solid #eadfc4; }
  .src { font-size: 11px; color: #8a7a55; margin-top: 3px; }
  #ask { display: flex; gap: 6px; }
  #ask input { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid #b8a67e; border-radius: 6px; min-width: 0; }
  #ask button { font: inherit; padding: 6px 10px; border: 0; background: #7a4b2a; color: #fff; border-radius: 6px; cursor: pointer; }
  #mode { font-size: 11px; color: #8a7a55; margin-top: 4px; }
  #attr { position: fixed; bottom: 6px; left: 12px; right: 12px; font-size: 11px; color: #555; }
  .hidden { display: none !important; }
  @media (max-width: 700px) { #panel { top: auto; height: 46vh; bottom: 34px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <span>Tiny Atlas: <b id="name">loading…</b></span>
  <label><input type="checkbox" id="osm"> OSM lines</label>
  <button id="fly">Fly the route</button>
</div>
<div id="panel">
  <div id="story" class="card hidden"></div>
  <div id="chat" class="card">
    <h3>Ask the guide</h3>
    <div id="log"><div class="a">Tap a landmark, or ask me about this region. I only answer from Wikipedia/Wikivoyage text.</div></div>
    <form id="ask"><input id="q" placeholder="e.g. How did Attabad Lake form?" autocomplete="off" maxlength="300"><button>Ask</button></form>
    <div id="mode"></div>
  </div>
</div>
<div id="attr">Elevation: Mapzen/AWS Terrain Tiles · Map data © OpenStreetMap contributors (ODbL) · Landmark text © Wikipedia / Wikivoyage contributors (CC BY-SA)</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const region = new URLSearchParams(location.search).get("region") || "hunza";
const $ = (id) => document.getElementById(id);
const getJSON = (url) => fetch(url).then(r => r.ok ? r.json() : Promise.reject(new Error(url + " " + r.status)));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e2d0);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 10, 400000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x998877, 1.0));
const sun = new THREE.DirectionalLight(0xfff2d0, 2.0);
sun.position.set(-1, 1.2, 0.6);
scene.add(sun);

const [meta, buf, feats, landmarks, itin, status] = await Promise.all([
  getJSON("/api/regions"),
  fetch(`/api/terrain/${region}?size=256`).then(r => r.arrayBuffer()),
  getJSON(`/api/features/${region}`).catch(() => ({})),
  getJSON(`/api/landmarks/${region}`).catch(() => []),
  getJSON(`/api/itinerary/${region}`).catch(() => ({ stops: [], route: [] })),
  getJSON("/api/status").catch(() => ({ llm: false })),
]);
$("name").textContent = meta[region].name;
$("mode").textContent = status.llm ? `Guide: LLM (${status.model})` : "Guide: quoting sources directly (no LLM key set)";

// ---------- terrain ----------
const dv = new DataView(buf);
const rows = dv.getUint32(0, true), cols = dv.getUint32(4, true);
const widthM = dv.getFloat32(8, true), heightM = dv.getFloat32(12, true);
const hm = new Float32Array(buf, 16, rows * cols);
let min = Infinity; for (const h of hm) if (h < min) min = h;

const EXAG = 1.5;
const geo = new THREE.PlaneGeometry(widthM, heightM, cols - 1, rows - 1);
geo.rotateX(-Math.PI / 2); // row 0 = north = -z
const pos = geo.attributes.position;
for (let i = 0; i < pos.count; i++) pos.setY(i, (hm[i] - min) * EXAG);
geo.computeVertexNormals();

const tex = await new THREE.TextureLoader().loadAsync(`/api/texture/${region}`).catch(() => null);
if (tex) { tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
// The texture carries baked hillshade, so light it evenly (MeshBasic) to avoid double shading.
scene.add(new THREE.Mesh(geo, tex
  ? new THREE.MeshBasicMaterial({ map: tex })
  : new THREE.MeshStandardMaterial({ color: 0xc8b48a, roughness: 1 })));

// Bilinear terrain height at normalised (u east, v south), in scene units.
function heightAt(u, v) {
  const x = Math.min(Math.max(u, 0), 1) * (cols - 1), y = Math.min(Math.max(v, 0), 1) * (rows - 1);
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, cols - 1), y1 = Math.min(y0 + 1, rows - 1);
  const fx = x - x0, fy = y - y0, g = (r, c) => hm[r * cols + c];
  const h = (g(y0, x0) * (1 - fx) + g(y0, x1) * fx) * (1 - fy) + (g(y1, x0) * (1 - fx) + g(y1, x1) * fx) * fy;
  return (h - min) * EXAG;
}
const world = (u, v, lift = 0) => new THREE.Vector3((u - 0.5) * widthM, heightAt(u, v) + lift, (v - 0.5) * heightM);

// OSM polylines draped on the terrain (debug overlay; the painted texture already shows them).
const osmGroup = new THREE.Group();
osmGroup.visible = !tex;
for (const [kind, color] of Object.entries({ road: 0x7a4b2a, river: 0x2f7fc1, lake: 0x2f7fc1 })) {
  const segs = [];
  for (const line of feats[kind] || []) for (let i = 0; i < line.length - 1; i++)
    for (const [u, v] of [line[i], line[i + 1]]) { const p = world(u, v, 25); segs.push(p.x, p.y, p.z); }
  if (!segs.length) continue;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(segs, 3));
  osmGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color })));
}
scene.add(osmGroup);
$("osm").checked = osmGroup.visible;
$("osm").onchange = (e) => { osmGroup.visible = e.target.checked; };

// ---------- landmarks: small procedural models (a GLB in /models/<slug>.glb replaces them) ----------
const S = widthM * 0.008;   // one "unit" of landmark size, in metres
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true });
const CREAM = 0xf1e2bd, RED = 0xb8452e, STONE = 0xa8998a, WHITE = 0xffffff, WOOD = 0x7a4b2a;

function modelFor(kind) {
  const g = new THREE.Group();
  const add = (geometry, color, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geometry, mat(color)); m.position.set(x, y, z); g.add(m); return m; };
  if (kind === "fort") {
    add(new THREE.BoxGeometry(3 * S, 1.6 * S, 3 * S), CREAM, 0, 0.8 * S, 0);
    for (const [x, z] of [[-1.5, -1.5], [1.5, -1.5], [-1.5, 1.5], [1.5, 1.5]]) {
      add(new THREE.CylinderGeometry(0.5 * S, 0.6 * S, 2.6 * S, 8), STONE, x * S, 1.3 * S, z * S);
      add(new THREE.ConeGeometry(0.65 * S, 0.7 * S, 8), RED, x * S, 2.95 * S, z * S);
    }
    add(new THREE.BoxGeometry(1.4 * S, 1.6 * S, 1.4 * S), STONE, 0, 2.4 * S, 0);
    add(new THREE.CylinderGeometry(0.04 * S, 0.04 * S, 2 * S, 6), WOOD, 0, 4.2 * S, 0);
    add(new THREE.BoxGeometry(1 * S, 0.6 * S, 0.05 * S), RED, 0.5 * S, 4.7 * S, 0);
  } else if (kind === "peak") {
    add(new THREE.ConeGeometry(2 * S, 5 * S, 6), STONE, 0, 2.5 * S, 0);
    add(new THREE.ConeGeometry(1 * S, 2.4 * S, 6), WHITE, 0, 3.8 * S, 0);
  } else if (kind === "bridge") {
    for (const x of [-2, 2]) add(new THREE.CylinderGeometry(0.15 * S, 0.2 * S, 2.2 * S, 6), WOOD, x * S, 1.1 * S, 0);
    add(new THREE.BoxGeometry(4.6 * S, 0.12 * S, 0.5 * S), WOOD, 0, 0.2 * S, 0);
    const cable = new THREE.Mesh(new THREE.TorusGeometry(2 * S, 0.04 * S, 4, 24, Math.PI), mat(0x444444));
    cable.rotation.z = Math.PI; cable.position.y = 2.2 * S; g.add(cable);
  } else { // lake / default: a pin
    add(new THREE.ConeGeometry(0.8 * S, 2.2 * S, 10), RED, 0, 1.1 * S, 0).rotation.x = Math.PI;
    add(new THREE.SphereGeometry(0.9 * S, 12, 10), RED, 0, 3 * S, 0);
  }
  return g;
}

const markers = new THREE.Group();
scene.add(markers);
const glb = new GLTFLoader();
for (const lm of landmarks) {
  const holder = new THREE.Group();
  holder.position.copy(world(lm.u, lm.v, 0));
  holder.userData.landmark = lm;
  const procedural = modelFor(lm.kind);
  holder.add(procedural);
  // Optional generated model (e.g. from Hunyuan3D): the API says whether web/models/<slug>.glb exists.
  if (lm.model) glb.load(`/models/${lm.slug}.glb`, (gltf) => {
    holder.remove(procedural);
    const m = gltf.scene, size = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
    m.scale.setScalar(6 * S / Math.max(size.x, size.y, size.z));
    holder.add(m);
  }, undefined, () => {});
  markers.add(holder);
}

// ---------- dotted itinerary route, draped on the terrain ----------
const stops = (itin.route || []).map(([u, v]) => world(u, v, 0));
let curve = null;
if (stops.length >= 2) {
  curve = new THREE.CatmullRomCurve3(stops, false, "centripetal");
  const N = 400, pts = [];
  for (let i = 0; i < N; i++) {
    const p = curve.getPointAt(i / (N - 1));
    const u = p.x / widthM + 0.5, v = p.z / heightM + 0.5;
    pts.push(p.x, heightAt(u, v) + 30, p.z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xc0392b, size: S * 0.55, sizeAttenuation: true })));
}

// ---------- interaction: click a landmark -> story + camera focus ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(markers.children, true)[0];
  if (!hit) return null;
  let o = hit.object; while (o && !o.userData.landmark) o = o.parent;
  return o || null;
}
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return; // it was a drag
  const m = pick(e); if (m) openLandmark(m.userData.landmark, m.position);
});
renderer.domElement.addEventListener("pointermove", (e) => { renderer.domElement.style.cursor = pick(e) ? "pointer" : ""; });

let focus = null;
async function openLandmark(lm, at) {
  focus = { from: controls.target.clone(), to: at.clone(), t: 0, camFrom: camera.position.clone(),
            camTo: at.clone().add(new THREE.Vector3(0, S * 14, S * 22)) };
  const card = $("story");
  card.classList.remove("hidden");
  card.replaceChildren();
  const h = document.createElement("h2"); h.textContent = lm.name;
  const k = document.createElement("div"); k.className = "kind"; k.textContent = lm.kind;
  const p = document.createElement("p"); p.textContent = "Loading story…";
  card.append(k, h, p);
  try {
    const s = await getJSON(`/api/story/${region}/${lm.slug}`);
    p.textContent = s.story;
    const a = document.createElement("a"); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Source: Wikipedia";
    card.append(a);
  } catch { p.textContent = lm.summary; }
}

window.__open = (slug) => {   // test/automation hook: same path as clicking the landmark
  const h = markers.children.find(m => m.userData.landmark.slug === slug);
  return h ? openLandmark(h.userData.landmark, h.position) : null;
};

// ---------- guide chat ----------
const history = [];
$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("q").value = "";
  const log = $("log");
  const qd = document.createElement("div"); qd.className = "q"; qd.textContent = q; log.append(qd);
  const ad = document.createElement("div"); ad.className = "a"; ad.textContent = "…"; log.append(ad);
  log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(`/api/guide/${region}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, history }) }).then(x => x.ok ? x.json() : Promise.reject(x.status));
    ad.textContent = r.answer;
    if (r.sources.length) {
      const s = document.createElement("div"); s.className = "src"; s.append("Sources: ");
      r.sources.forEach((c, i) => { if (i) s.append(", "); const a = document.createElement("a"); a.href = c.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = `[${c.n}] ${c.source}`; s.append(a); });
      ad.append(s);
    }
    history.push({ role: "user", content: q }, { role: "assistant", content: r.answer });
  } catch { ad.textContent = "Sorry, the guide is unavailable right now."; }
  log.scrollTop = log.scrollHeight;
});

// ---------- flyover: deterministic camera path (window.renderFrame(t) is used by the video export) ----------
const home = { pos: new THREE.Vector3(0, widthM * 0.5, heightM * 0.7), target: new THREE.Vector3(0, 2000, 0) };
camera.position.copy(home.pos); controls.target.copy(home.target); controls.update();

function flyPose(t) {
  if (!curve) return null;
  const ease = t * t * (3 - 2 * t);
  const p = curve.getPointAt(ease), ahead = curve.getPointAt(Math.min(ease + 0.05, 1));
  const dir = ahead.clone().sub(p).setY(0).normalize();
  const cam = p.clone().addScaledVector(dir, -S * 26).add(new THREE.Vector3(0, S * 16, 0));
  cam.y = Math.max(cam.y, heightAt(cam.x / widthM + 0.5, cam.z / heightM + 0.5) + S * 8);
  return { cam, look: ahead.clone().add(new THREE.Vector3(0, S * 2, 0)) };
}
let flying = null;
function renderFrame(t) {           // t in [0,1]; renders exactly one frame at that point of the flight
  const f = flyPose(t); if (!f) return;
  camera.position.copy(f.cam); camera.lookAt(f.look); renderer.render(scene, camera);
}
window.renderFrame = renderFrame;
window.__flyDuration = 20;
$("fly").onclick = () => { if (curve) flying = performance.now(); };
$("fly").disabled = !curve;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop((now) => {
  if (flying !== null) {
    const t = (now - flying) / (window.__flyDuration * 1000);
    if (t >= 1) { flying = null; controls.target.copy(home.target); camera.position.copy(home.pos); }
    else { renderFrame(t); return; }
  }
  if (focus) {
    focus.t = Math.min(1, focus.t + 0.04);
    const e = focus.t * focus.t * (3 - 2 * focus.t);
    controls.target.lerpVectors(focus.from, focus.to, e);
    camera.position.lerpVectors(focus.camFrom, focus.camTo, e);
    if (focus.t >= 1) focus = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
window.__ready = true;
window.__landmarks = landmarks.length;
</script>
</body>
</html>
