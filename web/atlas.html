<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Atlas map</title>
<meta name="description" content="An interactive illustrated relief map drawn from open elevation and map data.">
<meta name="theme-color" content="#15120f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315120f'/%3E%3Cpath d='M5 24 13 9l5 8 3-4 6 11H5Z' fill='%23e9a23b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Cormorant+SC:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600&family=Noto+Nastaliq+Urdu&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/atlas.css">
<link rel="stylesheet" href="css/tripkit.css">
<link rel="stylesheet" href="css/heritage.css">
<link rel="stylesheet" href="css/voices.css">
<link rel="stylesheet" href="css/roadstatus.css">
<link rel="stylesheet" href="css/storyflight.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body class="atlas">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <symbol id="i-route" viewBox="0 0 24 24"><path d="M8 17h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/><circle cx="6" cy="17" r="2"/><circle cx="18" cy="5" r="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5-12-7.5Z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 19h14"/></symbol>
</svg>
<main id="app"><canvas id="gl" tabindex="0" aria-label="Interactive relief map. Drag to turn, scroll to zoom, right-drag or arrow keys to move."></canvas><div id="labels"></div></main>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="js/atlas/main.js"></script>
<noscript><p style="padding:2rem;font-family:system-ui">This map is drawn in the browser, so it needs JavaScript.</p></noscript>
</body>
</html>
